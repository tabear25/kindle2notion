services:
  - type: web
    name: kindle2notion
    runtime: docker
    region: singapore           # closest Render region to Japan
    plan: free                  # free instances sleep after 15 min idle
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- Required ---------------------------------------------------
      - key: AMAZON_EMAIL
        sync: false
      - key: AMAZON_PASSWORD
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      # --- Web UI login (set these: the service is on the public internet)
      - key: WEB_USERNAME
        sync: false
      - key: WEB_PASSWORD
        sync: false
      # --- Turso (operational store) -----------------------------------
      # Persists the Amazon session across restarts (no more 2FA per cold
      # start on the free plan) and caches the Notion dedup keys.
      # Leave blank to fall back to an ephemeral local SQLite file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # --- Vercel frontend ---------------------------------------------
      # Exact origin of the static frontend, e.g. https://kindle2notion.vercel.app
      # Leave blank if you only use the Render-served UI (same origin).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # --- Optional: Google Sheets / NotebookLM sync (leave blank to disable) ----
      - key: GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      # Drive folder ID hosting the notebooklm/ 50-file set. Required for the
      # sync to locate the files (the 01_books/02_highlights master is retired).
      - key: NOTEBOOKLM_PARENT_FOLDER_ID
        sync: false
      # --- Runtime ----------------------------------------------------
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SCRAPE_MODE
        value: "xhr" 